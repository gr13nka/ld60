<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass mockups</title>
<style>
  :root { --ink: #1c1712; --paper: #efe6d4; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 16px/1.3 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  main { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding: 12px; height: 100vh; box-sizing: border-box; pointer-events: none; }
  figure { margin: 0; display: grid; grid-template-rows: 1fr auto; border: 2px solid var(--ink); }
  figure .view { min-height: 0; }
  figcaption { padding: 8px 12px; background: var(--ink); color: var(--paper); }
  figcaption b { font-size: 20px; margin-right: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <figure><div class="view" data-variant="lighter"></div><figcaption><b>1 · Зажигалка</b>пламя клонится к маршруту · шестерни щёлкают к коробку · перо на крышке</figcaption></figure>
  <figure><div class="view" data-variant="matchbox"></div><figcaption><b>2 · Коробок</b>горелая спичка — маршрут · трезубец с головками — коробок · перо под резинкой</figcaption></figure>
  <figure><div class="view" data-variant="gull"></div><figcaption><b>3 · Чайка</b>клюв — маршрут · коробок в клюве качается к коробку · хвостовое перо — перо</figcaption></figure>
  <figure><div class="view" data-variant="ziggurat"></div><figcaption><b>4 · Монумент</b>звезда на шпиле — маршрут · рычаг-тёрка — коробок · перо на мачте · висящий груз</figcaption></figure>
</main>
<script type="module" src="./compass-variants.js"></script>
</body>
</html>
